<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pendaftaran Anggota PMR</title>
    <link rel="stylesheet" href="css/pendaftaran.css" />
    <link rel="stylesheet" href="css/cms.css" />
  </head>
  <body data-page="pendaftaran">
    <div class="container">
      <h2>Formulir Pendaftaran PMR</h2>

      <div id="formClosed" class="notice" style="display: none" data-cfg="pendaftaranInfo">Pendaftaran anggota baru sedang ditutup.</div>

      <form id="pendaftaranForm" name="form-pendaftaran">
        <input type="text" name="website" class="hp-field" tabindex="-1" autocomplete="off" aria-hidden="true" />
        <label>Nama Lengkap</label>
        <input type="text" name="NamaLengkap" required />

        <label>Nama Panggilan</label>
        <input type="text" name="NamaPanggilan" required />

        <label>Tempat Tanggal Lahir</label>
        <input type="text" name="TTL" required />

        <label>Jenis Kelamin</label>
        <select name="JenisKelamin" required>
          <option value="">-- Pilih --</option>
          <option>Laki-laki</option>
          <option>Perempuan</option>
        </select>

        <label>Golongan Darah</label>
        <select name="GolDarah" required>
          <option value="">-- Pilih --</option>
          <option>A</option>
          <option>B</option>
          <option>AB</option>
          <option>O</option>
          <option>-</option>
        </select>

        <label>Agama</label>
        <select name="Agama" required>
          <option value="">-- Pilih --</option>
          <option>Islam</option>
          <option>Protestan</option>
          <option>Katolik</option>
          <option>Hindu</option>
          <option>Buddha</option>
          <option>Konghucu</option>
        </select>

        <label>Kelas</label>
        <select name="Kelas" required>
          <option value="">-- Pilih --</option>
          <option>VII A</option>
          <option>VII B</option>
          <option>VII C</option>
          <option>VII D</option>
          <option>VII E</option>
          <option>VII F</option>
          <option>VII G</option>
        </select>

        <label>Alamat Lengkap</label>
        <textarea name="Alamat" rows="3" required></textarea>

        <label>Nomor Telepon / Handphone</label>
        <input type="number" name="Telepon" required />

        <label>Email Aktif</label>
        <input type="email" name="Email" required />

        <label>Nomor Induk Kependudukan (NIK)</label>
        <input type="number" name="NIK" required />

        <label>Nama Orang Tua - Ayah</label>
        <input type="text" name="Ayah" required />

        <label>Nama Orang Tua - Ibu</label>
        <input type="text" name="Ibu" required />

        <button type="submit">Kirim Pendaftaran</button>
      </form>

      <div class="download-section">
        <h3>Download Dokumen</h3>
        <a href="Formulir_Pendaftaran_Pramasaju.pdf" data-cfg-href="formulirUrl" target="_blank" rel="noopener"
          >Download Formulir Pendaftaran</a
        >
        <a href="Surat_Pernyataan_Pramasaju.pdf" data-cfg-href="suratUrl" target="_blank" rel="noopener"
          >Download Surat Pernyataan</a
        >
      </div>

      <a href="index.html" class="btn-back">Kembali</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/config.js"></script>
    <script src="js/cms.js"></script>
    <script>
      document.getElementById("pendaftaranForm").addEventListener("submit", function (e) {
        e.preventDefault();
        CMS.submitForm(this, "pendaftaran", "Berhasil!", "Pendaftaran telah berhasil dikirim!");
      });
    </script>
  </body>
</html>
